server {
    listen 8080;
    server_name _;

    location /health {
        return 200 "ok\n";
    }

    location / {
        # =========👉每次新建只修改下面这两行！！=========
        proxy_pass https://wsdd2.vroefmate.cn/;
        proxy_set_header Host "wsdd2.vroefmate.cn";
        # =============================================

        proxy_set_header X‑Real‑IP $remote_addr;
        proxy_set_header X‑Forwarded‑For $proxy_add_x_forwarded_for;
        proxy_set_header X‑Forwarded‑Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 如果页面内链接会跳回源站，解开下面两行注释
        # sub_filter 'https://xxx.com'  '$scheme://$host';
        # sub_filter_once off;
    }
}
